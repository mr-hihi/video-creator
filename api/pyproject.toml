[project]
name = "video-tool-api"
version = "0.1.0"
description = "Video tool API — video operations run as batch jobs"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=46",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
